<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пожелание 5 из 6 🦋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 50%, #bfdbfe 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .snowflake {
            position: fixed;
            top: -10px;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.5em;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(167, 243, 208, 0.5);
            text-align: center;
            position: relative;
            z-index: 2;
            border: 3px solid #6ee7b7;
            animation: slideIn 0.8s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .counter {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 6em;
            margin-bottom: 20px;
            animation: butterfly 4s ease-in-out infinite;
        }

        @keyframes butterfly {
            0%, 100% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
        }

        h1 {
            color: #059669;
            font-size: 2.2em;
            margin-bottom: 25px;
            font-weight: 900;
        }

        .wish-text {
            color: #065f46;
            font-size: 1.15em;
            line-height: 1.9;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 18px 50px;
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.3em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(16, 185, 129, 0.6);
        }

        .btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 1.8em;
            }

            .emoji {
                font-size: 4em;
            }

            .wish-text {
                font-size: 1.05em;
            }

            .btn {
                padding: 15px 40px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="counter">5 из 6</div>
        <div class="emoji">🦋</div>
        <h1>Легкость и гармония</h1>
        <p class="wish-text">
            Желаю тебе легко идти по жизни, как бабочка порхает с цветка на цветок! 
            Пусть тревоги уходят, проблемы решаются сами собой, а внутри всегда царит 
            гармония и спокойствие. Будь лёгкой и свободной! 🌿💫
        </p>
        <a href="wish6.html" class="btn">А вот и финальное! 🎆</a>
    </div>

    <script>
        function createSnow() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.textContent = '❄';
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.fontSize = (Math.random() * 1 + 0.6) + 'em';
            snowflake.style.animationDuration = (Math.random() * 3 + 5) + 's';
            document.body.appendChild(snowflake);

            setTimeout(() => snowflake.remove(), 8000);
        }

        setInterval(createSnow, 400);
    </script>
</body>
</html>
